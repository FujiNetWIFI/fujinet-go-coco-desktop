name: Flatpak

# Last of the M7 CI jobs (see TODO). Builds both flatpak manifests
# (build-aux/flatpak/online.fujinet.go.coco.{gnome,kde}.yml) with
# flatpak-builder against the real GNOME/KDE runtimes pulled from Flathub,
# rather than flathub-infra's prebuilt build container images -- those only
# publish a handful of recent runtime versions each (gnome-49 was the
# newest at the time this was written; kde-6.11, what this project is
# pinned to, had no image yet even though the runtime itself was already
# current on Flathub) and this avoids being blocked on that lag. Slower
# (pulling ~1-2 GB of runtime + SDK per frontend, no cross-run cache), but
# it is exactly the recipe verified locally before this workflow was
# written, so a green run here means what it says.
#
# WITH_COCO_ROMS=OFF is baked into both manifests already (not a workflow
# concern): the system ROMs are not freely redistributable (see
# COMPLIANCE.md), so every artifact this repository publishes -- these
# flatpaks included -- embeds only the freely redistributable HDB-DOS pair.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - build-aux/flatpak/online.fujinet.go.coco.gnome.yml
          - build-aux/flatpak/online.fujinet.go.coco.kde.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install the runtime and SDK this manifest targets
        run: |
          runtime=$(sed -n 's/^runtime: *//p' "${{ matrix.manifest }}")
          runtime_version=$(sed -n "s/^runtime-version: *'\(.*\)'/\1/p" "${{ matrix.manifest }}")
          sdk=$(sed -n 's/^sdk: *//p' "${{ matrix.manifest }}")
          flatpak install -y --user flathub \
            "${runtime}/x86_64/${runtime_version}" \
            "${sdk}/x86_64/${runtime_version}"

      # No --install: building is the check. (Installing would also work,
      # but there is nothing here to run it against on a headless runner.)
      - name: Build
        run: |
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            build-flatpak "${{ matrix.manifest }}"
