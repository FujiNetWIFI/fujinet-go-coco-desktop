name: Linux

# First of the M7 CI jobs (see TODO): Linux only for now, macOS and Windows
# to follow once those frontends exist (M10) or their toolchains are proven
# out. Builds both frontends and runs the full test suite.
#
# WITH_COCO_ROMS=OFF throughout: the system ROMs are not freely
# redistributable (see COMPLIANCE.md), so CI never has them, the same as
# every artifact this repository publishes. That means boot_smoke,
# drivewire_smoke, debug, video_coco3 and video_coco2 report ctest's skip
# code (77) rather than actually running -- expected here, not a gap in this
# workflow.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # An Arch container, not ubuntu-latest: the frontends need Qt >= 6.7
    # (QRhiWidget, the GPU display) and GTK >= 4.16 (GdkMemoryTextureBuilder),
    # and ubuntu-latest (24.04) ships Qt 6.4 and GTK 4.14. A frontend whose
    # toolkit is too old is skipped by CMake, so on the old image this job
    # would go green having built nothing. The release packages are built on
    # ubuntu-26.04 (release.yml), which has what they need and dpkg-deb.
    runs-on: [self-hosted, Linux, X64, fujinet-builder]
    container: archlinux:latest
    # SDL3 installs to a non-standard prefix (see below), so every step that
    # runs a linked binary -- configure-time checks as well as ctest --
    # needs the loader to find it there.
    env:
      LD_LIBRARY_PATH: /tmp/sdl3-install/lib
    steps:
      - name: Install build tools and frontend toolkits
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja python pkgconf git \
            gtk4 libadwaita webkitgtk-6.0 qt6-base qt6-shadertools qt6-webengine \
            desktop-file-utils appstream \
            libx11 libxext libxrandr libxi libxss libxcursor libxkbcommon \
            wayland wayland-protocols libdrm mesa libpulse alsa-lib libxtst zlib

      - uses: actions/checkout@v4

      # SDL3 is too new to assume an apt package exists on every runner
      # image; built from source and pinned to the exact release this
      # project is developed and tested against, the same "pin what
      # matters" policy as XRoar (SHA256 tarball) and the FujiNet firmware
      # (pinned commit) elsewhere in this build.
      - name: Build and install SDL3 (release-3.4.12, pinned)
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git /tmp/sdl3-src
          cmake -S /tmp/sdl3-src -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/sdl3-build
          cmake --install /tmp/sdl3-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=/tmp/sdl3-install \
            -DWITH_COCO_ROMS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
